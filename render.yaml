services:
  - type: web
    name: pinfo-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://trypinfo.vercel.app,https://pinfo.vercel.app,https://ingrivo.vercel.app,http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: pinfo-db
          property: connectionString

databases:
  - name: pinfo-db
    plan: free
    databaseName: pinfo
    user: pinfo
